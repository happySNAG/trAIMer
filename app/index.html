<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>trAIMer</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230d1015'/%3E%3Cg fill='none' stroke='%23c8f24e' stroke-width='1.8' stroke-linecap='round'%3E%3Ccircle cx='12' cy='12' r='6'/%3E%3Cpath d='M12 3v3M12 18v3M3 12h3M18 12h3'/%3E%3Ccircle cx='12' cy='12' r='1.2' fill='%23c8f24e'/%3E%3C/g%3E%3C/svg%3E"

    <link rel="stylesheet" href="/styles.css" />

  <body>
    <div id="app">
      <aside id="sidebar">
        <div class="wordmark" id="wordmark">
          <span class="wordmark-sigil" id="wordmark-sigil"></span>
          <span>
            <span class="wordmark-name">tr<span class="wordmark-aim">AIM</span>er</span>
            <span class="wordmark-sub">Train. Measure. Tune.</span>
          </span>
        </div>
        <nav id="tabs" aria-label="Primary">
          <button data-tab="home" class="active">Home</button>
          <button data-tab="setup">Test</button>
          <button data-tab="results">Results</button>
          <button data-tab="history">History</button>
          <button data-tab="calibration">Calibration</button>
          <button data-tab="diagnostics">Diagnostics</button>
          <button data-tab="data">Data</button>
        </nav>
        <div class="sidebar-spacer"></div>
        <div class="sidebar-foot" id="app-footer"></div>
      </aside>
      <main>
        <section id="view-home"></section>
        <section id="view-setup" hidden></section>
        <section id="view-run" hidden></section>
        <section id="view-results" hidden></section>
        <section id="view-data" hidden></section>
        <section id="view-history" hidden></section>
        <section id="view-diagnostics" hidden></section>
        <section id="view-calibration" hidden></section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
