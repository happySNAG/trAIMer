name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: no-telemetry audit (sources)
        run: node scripts/audit-no-telemetry.mjs

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run test:browser
      - run: npm run build
      - name: release artifact verification
        run: node scripts/verify-release.mjs
      - name: no-telemetry audit (bundle)
        run: node scripts/audit-no-telemetry.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  native-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: PowerShell launcher scripts parse cleanly
        shell: pwsh
        run: |
          foreach ($script in @("scripts/release/windows/start-aldo-lab.ps1","scripts/release/windows/stop-aldo-lab.ps1")) {
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$null, [ref]$parseErrors)
            if ($parseErrors -and $parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Host "##[error]$script:$($_.Extent.StartLineNumber): $($_.Message)" }
              throw "PowerShell parse errors in $script"
            }
            Write-Host "parsed OK: $script"
          }
      - name: protocol parity checks (host-independent)
        shell: bash
        run: |
          npm ci
          npx vitest run tests/nativeProtocolConstants.test.ts
          bash scripts/build-native-windows.sh
      - name: compile helper (MSVC, warnings are errors)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          scripts\build-native-windows.bat
      - uses: actions/upload-artifact@v4
        with:
          name: aldo_capture_helper
          path: native/windows/aldo_capture_helper.exe
          retention-days: 30

  # Pass 6: full downloadable V1 RC portable release artifact.
  windows-release:
    runs-on: windows-latest
    needs: [native-windows]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: PowerShell launcher scripts parse cleanly
        shell: pwsh
        run: |
          foreach ($script in @("scripts/release/windows/start-aldo-lab.ps1","scripts/release/windows/stop-aldo-lab.ps1")) {
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$null, [ref]$parseErrors)
            if ($parseErrors -and $parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Host "##[error]$script:$($_.Extent.StartLineNumber): $($_.Message)" }
              throw "PowerShell parse errors in $script"
            }
            Write-Host "parsed OK: $script"
          }
      - name: native protocol / version constant verification
        shell: bash
        run: |
          npx vitest run tests/nativeProtocolConstants.test.ts
          bash scripts/build-native-windows.sh
      - name: engine test suite (Windows host)
        shell: bash
        run: npx vitest run
      - name: lint + strict typecheck
        shell: bash
        run: |
          npm run lint
          npm run typecheck
      - name: production build
        run: npm run build
      - name: release verification
        run: node scripts/verify-release.mjs
      - name: no-telemetry audit (sources + bundle)
        run: node scripts/audit-no-telemetry.mjs
      - name: npm audit
        run: npm audit --audit-level=moderate
      - name: download compiled helper
        uses: actions/download-artifact@v4
        with:
          name: aldo_capture_helper
          path: native/windows
      - name: package portable release folder + checksums
        shell: bash
        run: |
          node scripts/package-release.mjs \
            --helper native/windows/aldo_capture_helper.exe \
            --commit "${{ github.sha }}"
      - name: verify packaged artifact contents
        shell: pwsh
        run: |
          $manifest = Get-Content "release/AldoAimLab-*/manifest.json" -Raw | ConvertFrom-Json
          if ($manifest.helperBinaryIsPlaceholder) { throw "release contains a placeholder helper" }
          $required = @("aldo_capture_helper.exe","start-aldo-lab.ps1","stop-aldo-lab.ps1","FIRST-RUN.md","app/index.html")
          foreach ($f in $required) {
            $p = Join-Path "release/AldoAimLab-v$($manifest.appVersion)" $f
            if (-not (Test-Path $p)) { throw "missing release file: $f" }
          }
          Write-Host "release artifact verified: $($manifest.files.Count) files"
      - name: zip the portable folder
        shell: pwsh
        run: |
          $version = (Get-Content "release/AldoAimLab-*/manifest.json" -Raw | ConvertFrom-Json).appVersion
          $zipName = "Aldo-Aim-Lab-v$version-windows-x64.zip"
          Compress-Archive -Path "release/AldoAimLab-v*" -DestinationPath "release/$zipName" -Force
          "RELEASE_ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append
          # Publish the archive checksum directly in the job output.
          $hash = (Get-FileHash -Algorithm SHA256 "release/$zipName").Hash.ToLower()
          "SHA256: $hash  $zipName" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Write-Host "SHA256: $hash  $zipName"
      - uses: actions/upload-artifact@v4
        with:
          name: aldo-aim-lab-portable-release
          path: |
            release/Aldo-Aim-Lab-*-windows-x64.zip
            release/AldoAimLab-*-SHA256SUMS.txt
          retention-days: 90
